server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }
  # CX speaks only to the digital Link Partner API. Internal administration is not proxied.
  location ~ ^/api/v1/(locations/(validate|suggest|resolve|config)|prefeasibility|customers/(register|login|me|logout|consultations(/[A-Za-z0-9-]+)?)|consultations/[A-Za-z0-9-]+(/(retrieve|proposal-options|email))?)$ {
    set $link_partner_api http://link-partner-api:3000;
    proxy_pass $link_partner_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
    client_max_body_size 16k;
    add_header Cache-Control "no-store" always;
  }
  location /api/ { return 404; }
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }
}
